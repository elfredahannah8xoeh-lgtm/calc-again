jobs:
  armor-header:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build @ now
          command: |
            mkdir -p /var/tmp/run3
            set +o pipefail 2>/dev/null; seq 1 512466 | sed -n 'h;G;p' | head -n 10000 > /var/tmp/run3/cluster.orchard.photon; true
            echo "METRIC stage.bytes=$(wc -c </var/tmp/run3/cluster.orchard.photon)"
      - persist_to_workspace:
          root: /var/tmp/run3
          paths:
            - 'cluster.orchard.photon'
  INIT_DEV:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/run3
      - run:
          name: Close upstream
          command: |
            dd if=/var/tmp/run3/cluster.orchard.photon conv=lcase status=none 2>/dev/null | head -c 30 || true
      - run:
          name: Pull code
          command: git clone --depth 1 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar --extract --xz --file=output.tar.xz
      - run:
          no_output_timeout: 92m
          command: /bin/bash -c "./controller"
